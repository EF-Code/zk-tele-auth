name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Runtime policy
        run: |
          node --version
          npm --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major < 20 || major >= 27) process.exit(1)"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Tests and contract checks
        run: npm test
      - name: Artifact manifest check
        run: npm run artifacts:manifest:check
      - name: Development artifact verification
        run: npm run artifacts:verify:dev
      - name: Deterministic TON compilation
        run: npm run compile:ton
      - name: Package consumer smoke test
        run: npm run package:consumer-smoke
      - name: Public package export checks
        run: npm run test:exports
      - name: Browser client checks
        run: npm run test:client
      - name: OpenAPI contract checks
        run: npm run test:openapi
      - name: TON consumer checks
        run: npm run test:ton-consumer
      - name: Mini App quickstart checks
        run: npm run test:examples
      - name: Package contents
        run: npm pack --dry-run --ignore-scripts
      - name: SBOM and scanner hooks
        run: npm run sbom:package
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Secret signature scan
        shell: bash
        run: |
          ! git grep -I -n -E 'github_pat_[A-Za-z0-9_]{20,}|\bgh[pousr]_[A-Za-z0-9]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' --
      - name: Diff hygiene
        run: git diff --check

  container:
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build production image
        run: docker build --pull=false --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg ARTIFACT_MANIFEST_DIGEST="$(sha256sum artifacts/manifest.json | cut -d' ' -f1)" --tag zk-tele-auth:ci .
      - name: Inspect image metadata
        run: docker image inspect zk-tele-auth:ci --format '{{json .Config.Labels}}'
