name: Release preflight

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-review
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Select Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run fail-closed release preflight
        run: npm run release:preflight
      - name: Produce package SBOM and signing hooks
        env:
          RELEASE_REQUIRED_TOOLS: "1"
        run: npm run sbom:package:required
      - name: Show preflight report path
        if: always()
        run: test -f build/release-preflight.json && sed -n '1,260p' build/release-preflight.json || true
